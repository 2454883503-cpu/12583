- insert:
    - id: desktop-pet
      name: dsh-desktop-pet
      config:
        enabled: true
        alwaysOnTop: true
        petScale: 1
        petId: text
        hideWhenIdle: false
        animationEnabled: true
        idleFrequencySec: 20
        clickThrough: false
        startSleeping: false
        animationSpeed: 1
- insert:
    - id: session-sync
      name: dsh-session-sync
      config:
        enabled: true
        backend: git
        sessionRoot: ''
        repoDir: ''
        remote: ''
        branch: main
        gitBin: git
        ageBin: age
        ageRecipient: ''
        ageIdentity: ''
        autoPullOnStart: false
        autoPushOnTurnEnd: false
        pullIntervalMinutes: 0
        confirmVia: auto
        graceMs: 10000
        commandTimeoutMs: 120000
        maxOutputBytes: 262144
        commitName: dsh-session-sync
        commitEmail: dsh-session-sync@localhost
        registerCommand: true
        registerTools: true
- insert:
    - id: image-gen
      name: dsh-image-gen
      config:
        provider: google
- insert:
    - id: plugin-manager
      name: dsh-plugin-manager-plus
- insert:
    - id: workbuddy
      name: dsh-plugin-workbuddy
- insert:
    - id: our-free-model
      name: dsh-our-free-model
      config: {}
