- insert:
    - id: desktop-pet
      name: dsh-desktop-pet
      config:
        enabled: true
        alwaysOnTop: true
        petScale: 1
        petId: text
        hideWhenIdle: false
        animationEnabled: true
        idleFrequencySec: 20
        clickThrough: false
        startSleeping: false
        animationSpeed: 1
- insert:
    - id: session-sync
      name: dsh-session-sync
      config:
        enabled: true
        backend: git
        sessionRoot: ''
        repoDir: ''
        remote: ''
        branch: main
        gitBin: git
        ageBin: age
        ageRecipient: ''
        ageIdentity: ''
        autoPullOnStart: false
        autoPushOnTurnEnd: false
        pullIntervalMinutes: 0
        confirmVia: auto
        graceMs: 10000
        commandTimeoutMs: 120000
        maxOutputBytes: 262144
        commitName: dsh-session-sync
        commitEmail: dsh-session-sync@localhost
        registerCommand: true
        registerTools: true
- insert:
    - id: image-gen
      name: dsh-image-gen
      config:
        provider: google
- insert:
    - id: plugin-manager
      name: dsh-plugin-manager-plus
- insert:
    - id: workbuddy
      name: dsh-plugin-workbuddy
- insert:
    - id: our-free-model
      name: dsh-our-free-model
      config: {}
- insert:
    - id: dsh-ui-skin-loader
      name: ./packages/loader/lib/index.js
- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  config:
    version: 1
    step: done
    purpose: null
    process: standard
    completion: skipped
    usage: compact
    developerTools: false
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    transcriptView: standard
    performanceUsage: compact
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  config:
    enabled: true
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark
    fontSize: 16
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      gpt-local:
        displayName: GPT (Codex bridge)
        api: openai-completions
        baseURL: http://127.0.0.1:18080/v1
        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
        headers:
          Authorization: Bearer dummy-not-a-real-openai-api-key
        models:
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            contextWindow: 200000
            maxTokens: 32768
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 200000
            maxTokens: 32768
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 200000
            maxTokens: 32768
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
- id: workbuddy
  config:
    modelAllow:
      - deepseek-v4.1-flash
      - glm-5.3-flash
      - hy4-preview
      - kimi-k3-2
      - space-bunny
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: buddy
    model: minimax-m3.1-flash
    reasoningEffort: max
- insert:
    - id: gpt-quota
      name: file:///D:/AA12583/dsh/%E7%BB%84%E4%BB%B6/gpt-quota-plugin/index.mjs
    - id: gpt-bridge-autostart
      name: file:///D:/AA12583/dsh/%E7%BB%84%E4%BB%B6/gpt-bridge-autostart/index.mjs
      config:
        maxRetries: 10
        retryDelayMs: 30000
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: standard
- insert:
    - id: image-gen
      name: dsh-image-gen
      config:
        provider: openai-compat
        openaiCompatBaseURL: http://127.0.0.1:18080/v1
        openaiCompatModel: gpt-image-2.5
        openaiCompatQuality: high
        openaiCompatSizes:
          '1:1':
            1K: 1024x1024
          '2:3':
            1K: 1024x1536
          '3:2':
            1K: 1536x1024
